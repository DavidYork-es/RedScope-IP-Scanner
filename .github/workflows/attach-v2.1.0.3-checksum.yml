name: Attach verified SHA-256 to RedScope v2.1.0.3

# Runs once on this workflow addition or manually from GitHub Actions.
# Does not change the binary, release status, or repository visibility.
on:
  push:
    paths:
      - '.github/workflows/attach-v2.1.0.3-checksum.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: attach-redscope-v2.1.0.3-checksum
  cancel-in-progress: false

jobs:
  verify-and-attach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download user-supplied Windows ZIP from Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/redscope"
          gh release download v2.1.0.3 \
            --repo "$GH_REPO" \
            --pattern 'RedScope_v2.1.0.3_Windows_Portable.zip' \
            --dir "$RUNNER_TEMP/redscope"
          test -s "$RUNNER_TEMP/redscope/RedScope_v2.1.0.3_Windows_Portable.zip"

      - name: Calculate SHA-256 and verify GitHub asset digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/redscope"
          file='RedScope_v2.1.0.3_Windows_Portable.zip'
          calculated="$(sha256sum "$file" | cut -d ' ' -f 1)"
          observed="$(gh api "repos/$GH_REPO/releases/438144897" \
            --jq '.assets[] | select(.name=="RedScope_v2.1.0.3_Windows_Portable.zip") | .digest')"
          expected='4deddbc113cbac76d64e8b41adcb1a52da385c254e87fc13e1ba68c2145ea57e'
          if [[ "$calculated" != "$expected" || "$observed" != "sha256:$calculated" ]]; then
            echo "::error::SHA-256 does not match the user-uploaded ZIP. Refusing checksum upload."
            exit 1
          fi
          printf '%s  %s\n' "$calculated" "$file" > SHA256SUMS.txt
          echo "User-supplied RedScope ZIP verified: $calculated"

      - name: Upload SHA256SUMS.txt without changing the ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload v2.1.0.3 \
            "$RUNNER_TEMP/redscope/SHA256SUMS.txt" \
            --repo "$GH_REPO" --clobber
          gh release view v2.1.0.3 --repo "$GH_REPO" --json assets \
            --jq '.assets[].name' | grep -Fx 'SHA256SUMS.txt'
          echo 'Checksum attached to the existing published release.'
