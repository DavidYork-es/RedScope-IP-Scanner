name: Verify published RedScope release when repository becomes public

# This workflow does NOT publish or change repository visibility.
# Release v2.1.0.3 was already published while the repository was private.
# SourceForge integration can import it after the owner makes the repo public.
on:
  public:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-published-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public repository and published binary checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          visibility="$(gh api "repos/$GH_REPO" --jq '.visibility')"
          if [[ "$visibility" != "public" ]]; then
            echo "::error::Repository is private; SourceForge cannot import the standard public Release."
            exit 1
          fi

          release="repos/$GH_REPO/releases/438144897"
          tag="$(gh api "$release" --jq '.tag_name')"
          draft="$(gh api "$release" --jq '.draft')"
          zip_digest="$(gh api "$release" --jq '.assets[] | select(.name=="RedScope_v2.1.0.3_Windows_Portable.zip") | .digest')"
          checksum_name="$(gh api "$release" --jq '.assets[] | select(.name=="SHA256SUMS.txt") | .name')"
          if [[ "$tag" != "v2.1.0.3" || "$draft" != "false" ]]; then
            echo "::error::Release v2.1.0.3 is missing or unpublished."; exit 1
          fi
          if [[ "$zip_digest" != "sha256:4deddbc113cbac76d64e8b41adcb1a52da385c254e87fc13e1ba68c2145ea57e" ]]; then
            echo "::error::The distributable ZIP differs from the user-validated asset."; exit 1
          fi
          if [[ "$checksum_name" != "SHA256SUMS.txt" ]]; then
            echo "::error::SHA256SUMS.txt is missing."; exit 1
          fi
          echo 'Public repository and released ZIP verified. SourceForge can now import the published GitHub release.'
